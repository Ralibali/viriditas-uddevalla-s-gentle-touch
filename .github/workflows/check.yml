name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database migrations and SQL tests
        run: npm run test:db
      - name: Build and prerender
        run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    env:
      # The functions only use URL imports; the site's package.json is not theirs.
      DENO_NO_PACKAGE_JSON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        run: deno check supabase/functions/*/index.ts
      - name: Edge function tests
        run: deno test supabase/functions/tests/
